<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LearnPlay – Subject Games</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#020617;
  --glass:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.15);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',system-ui;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at top, #0f172a, #020617);
  color:#e5e7eb;
}

/* HEADER */
header{
  padding:35px;
  text-align:center;
}

header h1{
  font-size:40px;
  font-weight:800;
  background:linear-gradient(90deg,#38bdf8,#a855f7);
  -webkit-background-clip:text;
  color:transparent;
}

header p{
  margin-top:8px;
  color:#94a3b8;
}

/* GRID */
.subjects{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:30px;
  padding:40px;
}

/* CARD */
.card{
  background:var(--glass);
  backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:22px;
  padding:32px 25px;
  text-align:center;
  transition:.4s ease;
}

.card:hover{
  transform:translateY(-12px);
  box-shadow:0 0 45px rgba(56,189,248,.35);
}

/* ICON */
.icon{
  font-size:52px;
  margin-bottom:12px;
}

/* TEXT */
.card h2{
  font-size:22px;
  margin-bottom:10px;
}

.card p{
  font-size:14px;
  color:#cbd5f5;
  margin-bottom:20px;
}

/* BUTTON */
.card button{
  padding:12px 30px;
  border:none;
  border-radius:999px;
  background:linear-gradient(90deg,#38bdf8,#a855f7);
  color:#020617;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}

.card button:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px rgba(56,189,248,.8);
}

/* SUBJECT COLORS */
.maths{box-shadow:inset 0 0 0 2px #3b82f6;}
.physics{box-shadow:inset 0 0 0 2px #a855f7;}
.chemistry{box-shadow:inset 0 0 0 2px #22c55e;}
.biology{box-shadow:inset 0 0 0 2px #f97316;}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  color:#94a3b8;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
}

.popup{
  background:var(--glass);
  backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:22px;
  padding:30px;
  width:90%;
  max-width:420px;
  text-align:center;
}

.popup h3{
  margin-bottom:10px;
  color:#38bdf8;
}

.popup p{
  color:#cbd5f5;
  margin-bottom:20px;
}

.close{
  padding:10px 20px;
  border:none;
  border-radius:12px;
  background:#ef4444;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <h1>🎮 LearnPlay</h1>
  <p>Game-Based Learning Dashboard</p>
</header>

<main class="subjects">
  <div class="card maths" onclick="matg1()">
    <div class="icon">🧮</div>
    <h2>Maths</h2>
    <p>Puzzles • Logic • Speed Games</p>
    <button>Enter</button>
  </div>

  <div class="card physics" onclick="pyshg1()">
    <div class="icon">⚛️</div>
    <h2>Physics</h2>
    <p>Simulations • Motion Games</p>
    <button>Enter</button>
  </div>

  <div class="card chemistry" onclick="cheg1()">
    <div class="icon">🧪</div>
    <h2>Chemistry</h2>
    <p>Experiments • Reaction Games</p>
    <button>Enter</button>
  </div>

  <div class="card biology" onclick="biog1()">
    <div class="icon">🧬</div>
    <h2>Biology</h2>
    <p>Life • Systems • Explorer Games</p>
    <button>Enter</button>
  </div>
</main>

<footer>
  ⭐ Levels • 🎯 Challenges • 🏆 Rewards
</footer>

<div class="modal" id="modal">
  <div class="popup">
    <h3 id="title"></h3>
    <p>Game modes and levels will appear here.</p>
    <button class="close" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
function openInfo(subject){
  document.getElementById("title").innerText =
    subject + " Games – Coming Soon 🚀";
  document.getElementById("modal").style.display="flex";
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}
function matg1(){
  window.location.href='game2.html';
}
function pyshg1(){
  
    window.location.href='phyg1.html';
    }
function cheg1(){

        window.location.href='cheg1.html';
    }
function biog1(){
        window.location.href='sciencegame.html';
    } 
</script>

</body>
</html>
